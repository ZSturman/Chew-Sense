name: ChewSenseDemo
options:
  bundleIdPrefix: com.chewsense
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: ChewSenseDemo/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: com.chewsense.demo
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
targets:
  ChewSenseDemo:
    type: application
    platform: iOS
    sources:
      - path: ChewSenseDemo
        excludes:
          - "Resources/silence_README.txt"
    settings:
      base:
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: ChewSenseDemo/Info.plist
      properties:
        NSMotionUsageDescription: ChewSense uses motion-capable AirPods to detect chewing without a camera or microphone.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  ChewSenseDemoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChewSenseDemoTests
    dependencies:
      - target: ChewSenseDemo
  ChewSenseDemoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ChewSenseDemoUITests
    dependencies:
      - target: ChewSenseDemo
