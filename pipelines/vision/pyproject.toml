[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chewsense-vision"
version = "0.1.0"
description = "Video-based chew and eating-episode labeller."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "opencv-python>=4.9",
    "mediapipe>=0.10.14",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "pyarrow>=15",
    "matplotlib>=3.8",
    "soundfile>=0.12",
    "webrtcvad>=2.0.10",
    "tqdm>=4.66",
    "click>=8.1",
    "cryptography>=43",
]

[project.optional-dependencies]
ml = ["torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
chewsense-vision = "chewsense.cli:cli"

[tool.setuptools.packages.find]
include = ["chewsense*"]

[tool.ruff]
line-length = 100
