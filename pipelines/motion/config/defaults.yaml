# ChewSense Pipeline Configuration
# 
# This file contains all tunable parameters for the pipeline.
# Override any parameter via CLI: python main.py --lr 0.001
# Or use a custom config: python main.py --config path/to/custom.yaml
#
# Parameters are organized by category:
# - training: Model training hyperparameters
# - features: Feature extraction parameters
# - soft_labels: Soft label generation parameters
# - runtime: Real-time inference parameters (logged with model, used in app)

# =============================================================================
# TRAINING PARAMETERS
# =============================================================================
# These affect model training and are logged to W&B

training:
  batch_size: 256
  lr: 0.001
  epochs: 50
  val_ratio: 0.2
  hidden_dim: 32
  patience: 5
  # ---- Imbalance handling ----
  # loss: "bce" (BCEWithLogitsLoss with pos_weight) or "focal"
  loss: "bce"
  # pos_weight: "auto" sets pos_weight = n_neg/n_pos. Use "none" to disable, or a float.
  pos_weight: "auto"
  # WeightedRandomSampler ensures each minibatch is class-balanced.
  use_weighted_sampler: true
  focal_alpha: 0.25
  focal_gamma: 2.0
  # ---- Architecture ----
  # New models use the causal TCN over raw three-second windows. "mlp" is a
  # read/train compatibility option for legacy binary eating checkpoints only.
  arch: "causal_tcn"
  # ---- Split policy ----
  # If true, allow training without a locked split manifest (session-aware random fallback).
  allow_unsplit: false
  # ---- Augmentation ----
  # Cheap noise added to the 12-d feature vector during training (set 0 to disable).
  feature_noise_std: 0.02
  augmentation:
    enabled: false
    noise_std: 0.01
    rotation_deg: 8.0
    time_shift_frac: 0.05
    channel_dropout_p: 0.0

# =============================================================================
# FEATURE EXTRACTION PARAMETERS
# =============================================================================
# These affect how raw sensor data is converted to feature vectors

features:
  window_sec: 0.75      # Sliding window duration in seconds
  step_sec: 0.10        # Step size between windows in seconds
  # Sampling rate is auto-detected from data

# =============================================================================
# V2 TEMPORAL CHEW MODEL
# =============================================================================
# Input is (7, 150): six IMU axes at 50 Hz for three seconds plus a validity
# mask. Output is eating_logit, chew_event_logit, phase sin/cos/confidence.

temporal_model:
  enabled: true
  sample_rate_hz: 50
  context_sec: 3.0
  inference_step_sec: 0.10
  channels: [24, 24, 32, 32]
  kernel_size: 5
  dropout: 0.10
  eating_weight: 1.0
  event_weight: 2.0
  phase_weight: 0.5
  confidence_weight: 0.25

# =============================================================================
# SOFT LABEL GENERATION PARAMETERS
# =============================================================================
# These control how hard 0/1 labels are converted to soft continuous labels
# for smoother training (captures transition dynamics)

soft_labels:
  transition_sec: 0.6   # Short chew transition ramp duration
  long_chew_sec: 3.0    # Threshold (seconds) to consider a chew "long"
  long_ramp_sec: 1.5    # Ramp duration for long chews

# =============================================================================
# EVALUATION PARAMETERS
# =============================================================================
# Thresholds for binarizing soft labels and predictions during evaluation

evaluation:
  chew_threshold: 0.5   # Threshold to binarize soft labels (y >= 0.5 → chewing)
  pred_threshold: 0.5   # Threshold to binarize model probabilities

# =============================================================================
# RUNTIME INFERENCE PARAMETERS
# =============================================================================
# These are used by the iOS/macOS app for real-time chewing detection.
# They are logged with the model so the app can use the same values.
# Changing these DOES NOT require retraining - they are post-processing params.

runtime:
  alpha: 0.4            # EMA smoothing factor (0 = no smoothing, 1 = no memory)
  high_threshold: 0.6   # Probability threshold to START chewing episode
  low_threshold: 0.4    # Probability threshold to END chewing episode
  min_start_windows: 3  # Consecutive windows above high_threshold to confirm start
  min_end_windows: 2    # Consecutive windows below low_threshold to confirm end
  chew_event_threshold: 0.5
  min_gap_coverage: 0.8
  event_refractory_sec: 0.25
  confident_event_threshold: 0.5
  bout_merge_gap_sec: 1.5       # diagnostic eating-bout telemetry only
  min_bout_duration_sec: 1.0

# =============================================================================
# CLOSED-LOOP COLLECTION RECOMMENDATIONS
# =============================================================================
# These targets drive the "what should I record next?" list produced after
# field-test retraining and bundled into the RealWorldTesting app on deploy.

collection:
  max_recommendations: 5
  high_error_rate: 0.35
  moderate_error_rate: 0.15
  coverage_min_minutes: 3
  coverage_max_minutes: 8
  high_error_minutes: 8
  moderate_error_minutes: 6
  targets:
    - activity: eating_soft
      activity_label: Eating soft food
      expected_label_class: positive
      target_minutes: 8
      aliases: [eating]
    - activity: eating_hard
      activity_label: Eating hard food
      expected_label_class: positive
      target_minutes: 8
      aliases: []
    - activity: drinking_water
      activity_label: Drinking water
      expected_label_class: negative
      target_minutes: 6
      aliases: [drinking]
    - activity: not_eating
      activity_label: Not eating / baseline
      expected_label_class: negative
      target_minutes: 6
      aliases: [baseline, not-eating, noteating]
    - activity: walking
      activity_label: Walking
      expected_label_class: negative
      target_minutes: 6
      aliases: []
    - activity: head_shake
      activity_label: Shaking head
      expected_label_class: negative
      target_minutes: 6
      aliases: []
    - activity: nodding
      activity_label: Nodding
      expected_label_class: negative
      target_minutes: 6
      aliases: []
    - activity: talking
      activity_label: Talking
      expected_label_class: mixed
      target_minutes: 6
      aliases: []
    - activity: singing
      activity_label: Singing
      expected_label_class: mixed
      target_minutes: 6
      aliases: []

# =============================================================================
# WEIGHTS & BIASES
# =============================================================================
wandb:
  project: "chewsense"
  entity: null          # Optional: W&B team/username
  enabled: true         # Set to false to disable W&B logging
